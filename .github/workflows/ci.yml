name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Oxlint
        run: npm run lint -- --format github
      - name: Prettier
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (production deps, high and critical)
        run: npm audit --omit=dev --audit-level=high

  api:
    name: API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Start API and check it responds
        working-directory: api
        run: |
          uvicorn server.app:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf "localhost:8000/api/v1/products?limit=1" | grep -q '"success":true'
      - name: Every endpoint documents its response
        run: |
          curl -sf localhost:8000/openapi.json | python3 -c '
          import json, sys
          spec = json.load(sys.stdin)
          bad = [f"{m.upper()} {p}" for p, ops in spec["paths"].items() for m, op in ops.items()
                 if "$ref" not in op["responses"]["200"]["content"]["application/json"]["schema"] or "422" in op["responses"]]
          sys.exit(f"No response model or stray 422: {bad}" if bad else 0)
          '
      - name: Test mocks follow the current contract
        run: |
          ./scripts/export-openapi.sh
          node scripts/generate-api-types.mjs
          git diff --exit-code tests/api/generated || (echo "::error::API changed: run npm run api:types and commit tests/api/generated" && exit 1)

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image the baselines were taken in (scripts/playwright-docker.sh), so screenshots match pixel for pixel.
    # Keep the tag equal to @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle size
        run: |
          echo "### Bundle" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/* | sort -h >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
